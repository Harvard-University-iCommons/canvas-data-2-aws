AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::Serverless-2016-10-31
Description: >
  canvas-data-2

  This template contains infrastructure for maintaining a Postgresql database containing
  data sourced from Canvas Data 2. It uses the higher-level `dap` functionality from
  instructure to maintain the local tables.

  A Step Function is used to orchestrate the synchronization operations.

Parameters:
  EnvironmentParameter:
    Type: String
    AllowedValues:
      - "dev"
      - "prod"
    Default: "dev"

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - 'DEBUG'
      - 'INFO'
      - 'WARN'
      - 'ERROR'

  SkipTablesParameter:
    Type: String

  EngineVersionParameter:
    Type: String
    Default: "16.14"
    Description: >
      The Aurora PostgreSQL engine version to deploy. Pinned minor versions are
      retired by AWS over time; if the stack fails to create, check
      `aws rds describe-db-engine-versions --engine aurora-postgresql` for a
      currently available version.

  LogRetentionInDaysParameter:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: >
      How long to retain CloudWatch logs. Lambda log groups default to never
      expiring, which accumulates cost indefinitely for a workflow that runs
      every few hours across many tables.

  MapMaxConcurrencyParameter:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: >
      How many tables to sync concurrently. Each concurrent iteration opens its
      own connection to the database, and Aurora Serverless v2 scales
      max_connections with ACU capacity. Raising this without also raising
      DatabaseMinCapacityParameter risks connection errors, which are most
      likely on the first run when every table needs to be initialized.

  DatabaseMinCapacityParameter:
    Type: Number
    Default: 0.5
    Description: >
      Minimum Aurora Serverless v2 capacity (ACU). This is the floor you pay for
      continuously. Raise it if the first run reports connection failures.

  DatabaseMaxCapacityParameter:
    Type: Number
    Default: 4
    Description: Maximum Aurora Serverless v2 capacity (ACU).

  VpcIdParameter:
    Type: AWS::EC2::VPC::Id
    Description: The ID of the VPC to deploy the database and Lambda functions into.

  DatabaseSubnetListParameter:
    Type: List<AWS::EC2::Subnet::Id>
    Description: The list of one or more subnets to deploy the database into.

  LambdaSubnetListParameter:
    Type: List<AWS::EC2::Subnet::Id>
    Description: The list of one or more subnets to deploy the Lambda functions into.

Resources:

  KmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for encrypting secrets
      Enabled: true

  # Create a secret for the CD2 app "canvas" user
  DatabaseUserSecretCanvas:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub cd2-db-user-${EnvironmentParameter}-canvas
      Description: Aurora database user secret for canvas user
      GenerateSecretString:
        SecretStringTemplate: '{"username": "canvas"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true
      KmsKeyId: !Ref KmsKey

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub cd2-subnetgroup-${EnvironmentParameter}
      SubnetIds: !Ref DatabaseSubnetListParameter

  DatabaseClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub cd2-database-client-sg-${EnvironmentParameter}
      VpcId: !Ref VpcIdParameter

  EmptySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub cd2-empty-sg-${EnvironmentParameter}
      VpcId: !Ref VpcIdParameter

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub cd2-database-sg-${EnvironmentParameter}
      VpcId: !Ref VpcIdParameter
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref DatabaseClientSecurityGroup
        # TODO: add more ingress rules based on parameter(s)

  AuroraDatabaseCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineVersion: !Ref EngineVersionParameter
      MasterUsername: cd2admin
      ManageMasterUserPassword: true
      MasterUserSecret:
        KmsKeyId: !Ref KmsKey
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds:
          - !Ref DatabaseSecurityGroup
      Port: 5432
      DatabaseName: cd2
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref DatabaseMinCapacityParameter
        MaxCapacity: !Ref DatabaseMaxCapacityParameter
      DeletionProtection: false
      EnableHttpEndpoint: true
      BackupRetentionPeriod: 7
      StorageEncrypted: true

  # Attach Canvas database user Secret to the cluster
  DatabaseUserSecretAttachmentCanvas:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DatabaseUserSecretCanvas
      TargetId: !Ref AuroraDatabaseCluster
      TargetType: AWS::RDS::DBCluster

  AuroraDatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      DBClusterIdentifier: !Ref AuroraDatabaseCluster

  # Log groups are declared explicitly so that retention is bounded. Lambda's
  # implicit log groups never expire. The names must stay under /aws/lambda/ so
  # that the managed AWSLambdaBasicExecutionRole policy still grants write access.
  ListTablesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/cd2-${EnvironmentParameter}-list-tables
      RetentionInDays: !Ref LogRetentionInDaysParameter

  SyncTableLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/cd2-${EnvironmentParameter}-sync-table
      RetentionInDays: !Ref LogRetentionInDaysParameter

  InitTableLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/cd2-${EnvironmentParameter}-init-table
      RetentionInDays: !Ref LogRetentionInDaysParameter

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/states/cd2-${EnvironmentParameter}-refresh
      RetentionInDays: !Ref LogRetentionInDaysParameter

  ListTablesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: list_tables/
      Handler: app.lambda_handler
      Runtime: python3.13
      Tracing: Active
      LoggingConfig:
        LogGroup: !Ref ListTablesLogGroup
      Architectures:
        - x86_64
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${EnvironmentParameter}/canvas_data_2*'
      Environment:
        Variables:
          ENV: !Ref EnvironmentParameter
          POWERTOOLS_METRICS_NAMESPACE: canvas-data-2
          POWERTOOLS_SERVICE_NAME: list_tables
          LOG_LEVEL: !Ref LogLevel
          SKIP_TABLES: !Ref SkipTablesParameter
      Timeout: 120
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref EmptySecurityGroup
        SubnetIds: !Ref LambdaSubnetListParameter

  SyncTableFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: sync_table/
      Handler: app.lambda_handler
      Runtime: python3.13
      Tracing: Active
      LoggingConfig:
        LogGroup: !Ref SyncTableLogGroup
      # the dap client streams TSV downloads to disk before loading them
      EphemeralStorage:
        Size: 1024
      Architectures:
        - x86_64
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${EnvironmentParameter}/canvas_data_2*'
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseUserSecretCanvas
        - KMSDecryptPolicy:
            KeyId: !Ref KmsKey
      Environment:
        Variables:
          ENV: !Ref EnvironmentParameter
          POWERTOOLS_METRICS_NAMESPACE: canvas-data-2
          POWERTOOLS_SERVICE_NAME: sync_table
          LOG_LEVEL: !Ref LogLevel
          DB_USER_SECRET_NAME: !Ref DatabaseUserSecretCanvas
      Timeout: 900
      MemorySize: 2048
      VpcConfig:
        SecurityGroupIds:
          - !Ref DatabaseClientSecurityGroup
        SubnetIds: !Ref LambdaSubnetListParameter

  InitTableFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: init_table/
      Handler: app.lambda_handler
      Runtime: python3.13
      Tracing: Active
      LoggingConfig:
        LogGroup: !Ref InitTableLogGroup
      # a full table snapshot is larger than an incremental sync
      EphemeralStorage:
        Size: 2048
      Architectures:
        - x86_64
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${EnvironmentParameter}/canvas_data_2*'
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseUserSecretCanvas
        - KMSDecryptPolicy:
            KeyId: !Ref KmsKey
      Environment:
        Variables:
          ENV: !Ref EnvironmentParameter
          POWERTOOLS_METRICS_NAMESPACE: canvas-data-2
          POWERTOOLS_SERVICE_NAME: init_table
          LOG_LEVEL: !Ref LogLevel
          DB_USER_SECRET_NAME: !Ref DatabaseUserSecretCanvas
      Timeout: 900
      MemorySize: 8192
      VpcConfig:
        SecurityGroupIds:
          - !Ref DatabaseClientSecurityGroup
        SubnetIds: !Ref LambdaSubnetListParameter

  WorkflowNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Sub "Canvas Data 2 Synchronization Workflow (${EnvironmentParameter})"

  StatesExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - !Sub states.${AWS::Region}.amazonaws.com
            Action: "sts:AssumeRole"
      Path: "/"
      Policies:
        - PolicyName: StatesExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "lambda:InvokeFunction"
                Resource:
                  - !Sub "${ListTablesFunction.Arn}*"
                  - !Sub "${SyncTableFunction.Arn}*"
                  - !Sub "${InitTableFunction.Arn}*"
        - PolicyName: NotificationPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref WorkflowNotificationTopic
        # Step Functions manages its log delivery through resource-level APIs that
        # do not accept a scoped-down resource ARN; AWS requires "*" here.
        - PolicyName: LoggingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"
        - PolicyName: TracingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"

  CD2RefreshStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Role: !GetAtt StatesExecutionRole.Arn
      Tracing:
        Enabled: true
      # Step Functions execution logging defaults to OFF, which leaves the console
      # as the only record of why a run failed.
      Logging:
        Level: ALL
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      Events:
        ThreeHourlySchedule:
          Type: ScheduleV2
          Properties:
            Description: Execute the Canvas Data 2 Step Function every 3 hours
            FlexibleTimeWindow:
              Mode: FLEXIBLE
              MaximumWindowInMinutes: 10
            ScheduleExpression: rate(3 hours)
            State: ENABLED
      Definition:
        StartAt: ListTables
        States:
          ListTables:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            OutputPath: "$.Payload"
            Parameters:
              Payload.$: "$"
              FunctionName: !Ref ListTablesFunction
            Retry:
              - ErrorEquals:
                 - Lambda.ServiceException
                 - Lambda.AWSLambdaException
                 - Lambda.SdkClientException
                 - Lambda.TooManyRequestsException
                IntervalSeconds: 2
                MaxAttempts: 6
                BackoffRate: 6
            Next: ProcessTables
          ProcessTables:
            Type: Map
            MaxConcurrency: !Ref MapMaxConcurrencyParameter
            ItemsPath: "$.tables"
            Next: PivotResults
            ItemProcessor:
              ProcessorConfig:
                Mode: INLINE
              StartAt: SyncTable
              States:
                SyncTable:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    Payload.$: "$"
                    FunctionName: !Ref SyncTableFunction
                  Retry:
                    - ErrorEquals:
                      - Lambda.ServiceException
                      - Lambda.AWSLambdaException
                      - Lambda.SdkClientException
                      - Lambda.TooManyRequestsException
                      IntervalSeconds: 2
                      MaxAttempts: 6
                      BackoffRate: 6
                  Catch:
                    - ErrorEquals:
                      - States.TaskFailed
                      ResultPath: "$.error"
                      Next: TableFailed
                  Next: CheckSyncState
                CheckSyncState:
                  Type: Choice
                  Choices:
                    - Variable: "$.Payload.state"
                      StringEquals: needs_init
                      Next: InitTable
                    # no views are created against these tables, so this should not
                    # happen; surface it as a failure rather than silently passing
                    - Variable: "$.Payload.state"
                      StringEquals: needs_ddl_update
                      Next: TableFailed
                  Default: TableComplete
                InitTable:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    Payload.$: "$.Payload"
                    FunctionName: !Ref InitTableFunction
                  Retry:
                    - ErrorEquals:
                      - Lambda.ServiceException
                      - Lambda.AWSLambdaException
                      - Lambda.SdkClientException
                      - Lambda.TooManyRequestsException
                      IntervalSeconds: 2
                      MaxAttempts: 6
                      BackoffRate: 6
                  Catch:
                    - ErrorEquals:
                      - States.TaskFailed
                      ResultPath: "$.error"
                      Next: TableFailed
                  Next: CheckInitState
                CheckInitState:
                  Type: Choice
                  Choices:
                    - Variable: "$.Payload.state"
                      StringEquals: failed
                      Next: TableFailed
                  Default: TableComplete
                TableFailed:
                  Type: Pass
                  OutputPath: "$.Payload"
                  End: true
                TableComplete:
                  Type: Succeed
                  OutputPath: "$.Payload"
          PivotResults:
            Type: Pass
            Next: SendNotification
            Parameters:
              - failed.$: "$[?(@.state==failed || @.state==needs_init || @.state==needs_sync || @.state==needs_ddl_update)].table_name"
              - failed_init.$: "$[?(@.state==needs_init)].table_name"
              - failed_sync.$: "$[?(@.state==needs_sync)].table_name"
              - failed_ddl_update.$: "$[?(@.state==needs_ddl_update)].table_name"
              - complete.$: "$[?(@.state==complete)].table_name"
              - num_failed.$: "States.ArrayLength($[?(@.state==failed || @.state==needs_init || @.state==needs_sync || @.state==needs_ddl_update)].table_name)"
              - num_complete.$: "States.ArrayLength($[?(@.state==complete)].table_name)"
          SendNotification:
            Type: Task
            Resource: arn:aws:states:::sns:publish
            Parameters:
              Message.$: "$"
              TopicArn: !Ref WorkflowNotificationTopic
            End: true

  # The workflow publishes a summary to SNS on every run, success or failure, so
  # failures are easy to miss among the routine notifications. This alarms only
  # when an execution actually fails.
  WorkflowFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cd2-${EnvironmentParameter}-workflow-failed
      AlarmDescription: The Canvas Data 2 refresh workflow failed to complete.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref CD2RefreshStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WorkflowNotificationTopic

Outputs:
  AdminSecretArn:
    Value: !GetAtt AuroraDatabaseCluster.MasterUserSecret.SecretArn
    Description: The ARN of the Aurora admin user secret
    Export:
      Name: !Sub cd2-aurora-admin-secret-arn-${EnvironmentParameter}
  AuroraClusterArn:
    Value: !GetAtt AuroraDatabaseCluster.DBClusterArn
    Description: The ARN of the Aurora cluster
    Export:
      Name: !Sub cd2-aurora-cluster-arn-${EnvironmentParameter}
