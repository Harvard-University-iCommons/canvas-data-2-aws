AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::Serverless-2016-10-31
Description: >
  canvas-data-2

  This template contains infrastructure for maintaining a Postgresql database containing
  data sourced from Canvas Data 2. It uses the higher-level `dap` functionality from
  instructure to maintain the local tables.

  A Step Function is used to orchestrate the synchronization operations.

Parameters:
  EnvironmentParameter:
    Type: String
    AllowedValues:
      - "dev"
      - "prod"
    Default: "dev"

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - 'DEBUG'
      - 'INFO'
      - 'WARN'
      - 'ERROR'

  SkipTablesParameter:
    Type: String

  EngineVersionParameter:
    Type: String
    Default: "16.14"
    Description: >
      The Aurora PostgreSQL engine version to deploy. The dap client supports
      PostgreSQL 16.3 and later; it does not check this at runtime, so an older
      engine fails in obscure ways rather than reporting a clear error. Pinned
      minor versions are also retired by AWS over time, so if the stack fails to
      create, check `aws rds describe-db-engine-versions --engine
      aurora-postgresql` for a currently available version.

  LogRetentionInDaysParameter:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: >
      How long to retain CloudWatch logs. Lambda log groups default to never
      expiring, which accumulates cost indefinitely for a workflow that runs
      every few hours across many tables.

  DatabaseMinCapacityParameter:
    Type: Number
    Default: 0.5
    Description: >
      Minimum Aurora Serverless v2 capacity (ACU). This is the floor you pay for
      continuously. Raise it if the first run reports connection failures.

  DatabaseMaxCapacityParameter:
    Type: Number
    Default: 4
    Description: Maximum Aurora Serverless v2 capacity (ACU).

  CreateNetworkParameter:
    Type: String
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"
    Description: >
      Whether to create a VPC, subnets and a NAT gateway for this stack. Set this
      to Yes to deploy with no networking prerequisites, and leave the three
      parameters below blank. Note that the NAT gateway is billed hourly whether
      or not the workflow is running; deleting the stack stops that charge.
      Set this to No to deploy into a VPC you already have.

  VpcCidrParameter:
    Type: String
    Default: "10.0.0.0/16"
    Description: >
      CIDR block for the created VPC. Only used when CreateNetworkParameter is
      Yes. Subnet ranges are derived from this, so it can be changed to avoid
      collisions without editing the subnets individually.

  # The three parameters below are plain strings rather than AWS::EC2::VPC::Id and
  # List<AWS::EC2::Subnet::Id>. Those types exist to reference resources that already
  # exist and reject an empty value, which would make them impossible to leave blank
  # when CreateNetworkParameter is Yes. The Rules section below restores the check
  # that matters: that they are actually supplied when the network is not being created.
  VpcIdParameter:
    Type: String
    Default: ""
    AllowedPattern: "^$|^vpc-(([0-9A-Fa-f]{8})|([0-9A-Fa-f]{17}))$"
    ConstraintDescription: must be blank or a VPC ID such as vpc-0123456789abcdef0
    Description: >
      The ID of the VPC to deploy the database and Lambda functions into. Required
      when CreateNetworkParameter is No; leave blank otherwise.

  DatabaseSubnetListParameter:
    Type: CommaDelimitedList
    Default: ""
    # For a CommaDelimitedList, CloudFormation splits on commas first and applies this
    # pattern to each element, so the regex never sees a comma. Surrounding whitespace
    # is tolerated because "subnet-a, subnet-b" is a natural way to write the list.
    AllowedPattern: '^$|^\s*subnet-(([0-9A-Fa-f]{8})|([0-9A-Fa-f]{17}))\s*$'
    ConstraintDescription: must be blank or a comma-separated list of subnet IDs
    Description: >
      The subnets to deploy the database into. RDS requires at least two, in
      different Availability Zones, even though this template creates only a
      single database instance. Required when CreateNetworkParameter is No;
      leave blank otherwise.

  LambdaSubnetListParameter:
    Type: CommaDelimitedList
    Default: ""
    # For a CommaDelimitedList, CloudFormation splits on commas first and applies this
    # pattern to each element, so the regex never sees a comma. Surrounding whitespace
    # is tolerated because "subnet-a, subnet-b" is a natural way to write the list.
    AllowedPattern: '^$|^\s*subnet-(([0-9A-Fa-f]{8})|([0-9A-Fa-f]{17}))\s*$'
    ConstraintDescription: must be blank or a comma-separated list of subnet IDs
    Description: >
      The list of one or more subnets to deploy the Lambda functions into.
      Required when CreateNetworkParameter is No; leave blank otherwise.

Conditions:
  CreateNetwork: !Equals [!Ref CreateNetworkParameter, "Yes"]

Rules:
  # Without this, omitting the VPC parameters fails partway through resource
  # creation with an opaque error instead of at parameter validation.
  NetworkRequiredWhenNotCreated:
    RuleCondition: !Equals [!Ref CreateNetworkParameter, "No"]
    Assertions:
      - Assert: !Not [!Equals [!Ref VpcIdParameter, ""]]
        AssertDescription: >
          VpcIdParameter is required when CreateNetworkParameter is No. Set
          CreateNetworkParameter to Yes to have the stack create its own network.
      - Assert: !Not [!Equals [!Join ["", !Ref DatabaseSubnetListParameter], ""]]
        AssertDescription: >
          DatabaseSubnetListParameter is required when CreateNetworkParameter is No.
      - Assert: !Not [!Equals [!Join ["", !Ref LambdaSubnetListParameter], ""]]
        AssertDescription: >
          LambdaSubnetListParameter is required when CreateNetworkParameter is No.

Resources:

  # ---------------------------------------------------------------------------
  # Optional network. Everything in this block is created only when
  # CreateNetworkParameter is Yes, so that the stack can be deployed with no
  # networking prerequisites.
  #
  # Two Availability Zones, because an RDS DB subnet group must cover at least
  # two even though this template creates a single database instance.
  #
  # The Lambda functions need outbound internet access to reach the DAP API, and
  # a VPC-attached Lambda has none by default. Lambda ENIs never receive public
  # IP addresses, so putting the functions in the public subnets would not help,
  # and no VPC endpoint can reach a third-party endpoint. That makes the NAT
  # gateway a requirement rather than a convenience.
  # ---------------------------------------------------------------------------

  Vpc:
    Type: AWS::EC2::VPC
    Condition: CreateNetwork
    Properties:
      CidrBlock: !Ref VpcCidrParameter
      # Both are required for the RDS cluster endpoint to resolve from inside the VPC.
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub cd2-${EnvironmentParameter}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateNetwork
    Properties:
      Tags:
        - Key: Name
          Value: !Sub cd2-${EnvironmentParameter}-igw

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Subnet ranges are carved out of the VPC CIDR rather than hardcoded, so that
  # changing VpcCidrParameter does not require editing each subnet. With the
  # default /16 this yields four /24s: 10.0.0.0, 10.0.1.0, 10.0.2.0, 10.0.3.0.
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidrParameter, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub cd2-${EnvironmentParameter}-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidrParameter, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub cd2-${EnvironmentParameter}-public-2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidrParameter, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub cd2-${EnvironmentParameter}-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidrParameter, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub cd2-${EnvironmentParameter}-private-2

  NatEip:
    Type: AWS::EC2::EIP
    Condition: CreateNetwork
    Properties:
      Domain: vpc

  # A single NAT gateway serves both private subnets. One per AZ would remove this
  # as a single point of failure and avoid cross-AZ data charges, at roughly double
  # the fixed cost.
  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: CreateNetwork
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub cd2-${EnvironmentParameter}-nat

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub cd2-${EnvironmentParameter}-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateNetwork
    # The route cannot be created until the gateway is actually attached to the
    # VPC, and CloudFormation does not infer that ordering from the properties.
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNetwork
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNetwork
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub cd2-${EnvironmentParameter}-private-rt

  PrivateRoute:
    Type: AWS::EC2::Route
    Condition: CreateNetwork
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNetwork
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNetwork
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ---------------------------------------------------------------------------
  # Application resources
  # ---------------------------------------------------------------------------

  KmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for encrypting secrets
      Enabled: true

  # Create a secret for the CD2 app "canvas" user
  DatabaseUserSecretCanvas:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub cd2-db-user-${EnvironmentParameter}-canvas
      Description: Aurora database user secret for canvas user
      GenerateSecretString:
        SecretStringTemplate: '{"username": "canvas"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true
      KmsKeyId: !Ref KmsKey

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub cd2-subnetgroup-${EnvironmentParameter}
      SubnetIds: !If
        - CreateNetwork
        - [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
        - !Ref DatabaseSubnetListParameter

  # W1030 is suppressed on the three security groups below. cfn-lint checks that a
  # VpcId looks like a VPC ID, and cannot tell that the !Ref VpcIdParameter branch
  # is unreachable when CreateNetwork is true -- so it flags the empty default that
  # exists precisely so the parameter can be left blank in that case. The
  # AllowedPattern on VpcIdParameter enforces the format when a value is supplied.
  DatabaseClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      GroupDescription: !Sub cd2-database-client-sg-${EnvironmentParameter}
      VpcId: !If [CreateNetwork, !Ref Vpc, !Ref VpcIdParameter]

  EmptySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      GroupDescription: !Sub cd2-empty-sg-${EnvironmentParameter}
      VpcId: !If [CreateNetwork, !Ref Vpc, !Ref VpcIdParameter]

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      GroupDescription: !Sub cd2-database-sg-${EnvironmentParameter}
      VpcId: !If [CreateNetwork, !Ref Vpc, !Ref VpcIdParameter]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref DatabaseClientSecurityGroup
        # TODO: add more ingress rules based on parameter(s)

  AuroraDatabaseCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineVersion: !Ref EngineVersionParameter
      MasterUsername: cd2admin
      ManageMasterUserPassword: true
      MasterUserSecret:
        KmsKeyId: !Ref KmsKey
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds:
          - !Ref DatabaseSecurityGroup
      Port: 5432
      DatabaseName: cd2
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref DatabaseMinCapacityParameter
        MaxCapacity: !Ref DatabaseMaxCapacityParameter
      DeletionProtection: false
      EnableHttpEndpoint: true
      BackupRetentionPeriod: 7
      StorageEncrypted: true

  # Attach Canvas database user Secret to the cluster
  DatabaseUserSecretAttachmentCanvas:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DatabaseUserSecretCanvas
      TargetId: !Ref AuroraDatabaseCluster
      TargetType: AWS::RDS::DBCluster

  AuroraDatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      DBClusterIdentifier: !Ref AuroraDatabaseCluster
      # The default depends on the subnet configuration, so state it explicitly:
      # nothing outside the VPC should be able to reach this database.
      PubliclyAccessible: false
      # EngineVersionParameter pins an exact version. Letting AWS apply minor
      # upgrades in the background would silently diverge from it, so upgrades
      # are a deliberate act here: bump the parameter and redeploy. If you would
      # rather have patches applied automatically, set this to true and expect
      # the deployed version to drift ahead of the template.
      AutoMinorVersionUpgrade: false

  # Log groups are declared explicitly so that retention is bounded. Lambda's
  # implicit log groups never expire. The names must stay under /aws/lambda/ so
  # that the managed AWSLambdaBasicExecutionRole policy still grants write access.
  ListTablesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/cd2-${EnvironmentParameter}-list-tables
      RetentionInDays: !Ref LogRetentionInDaysParameter

  SyncTableLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/cd2-${EnvironmentParameter}-sync-table
      RetentionInDays: !Ref LogRetentionInDaysParameter

  InitTableLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/cd2-${EnvironmentParameter}-init-table
      RetentionInDays: !Ref LogRetentionInDaysParameter

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/states/cd2-${EnvironmentParameter}-refresh
      RetentionInDays: !Ref LogRetentionInDaysParameter

  ListTablesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: list_tables/
      Handler: app.lambda_handler
      Runtime: python3.13
      Tracing: Active
      LoggingConfig:
        LogGroup: !Ref ListTablesLogGroup
      Architectures:
        - x86_64
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${EnvironmentParameter}/canvas_data_2*'
      Environment:
        Variables:
          ENV: !Ref EnvironmentParameter
          POWERTOOLS_METRICS_NAMESPACE: canvas-data-2
          POWERTOOLS_SERVICE_NAME: list_tables
          LOG_LEVEL: !Ref LogLevel
          SKIP_TABLES: !Ref SkipTablesParameter
      Timeout: 120
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref EmptySecurityGroup
        SubnetIds: !If
          - CreateNetwork
          - [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
          - !Ref LambdaSubnetListParameter

  SyncTableFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: sync_table/
      Handler: app.lambda_handler
      Runtime: python3.13
      Tracing: Active
      LoggingConfig:
        LogGroup: !Ref SyncTableLogGroup
      # the dap client streams TSV downloads to disk before loading them
      EphemeralStorage:
        Size: 1024
      Architectures:
        - x86_64
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${EnvironmentParameter}/canvas_data_2*'
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseUserSecretCanvas
        - KMSDecryptPolicy:
            KeyId: !Ref KmsKey
      Environment:
        Variables:
          ENV: !Ref EnvironmentParameter
          POWERTOOLS_METRICS_NAMESPACE: canvas-data-2
          POWERTOOLS_SERVICE_NAME: sync_table
          LOG_LEVEL: !Ref LogLevel
          DB_USER_SECRET_NAME: !Ref DatabaseUserSecretCanvas
      Timeout: 900
      MemorySize: 2048
      VpcConfig:
        SecurityGroupIds:
          - !Ref DatabaseClientSecurityGroup
        SubnetIds: !If
          - CreateNetwork
          - [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
          - !Ref LambdaSubnetListParameter

  InitTableFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: init_table/
      Handler: app.lambda_handler
      Runtime: python3.13
      Tracing: Active
      LoggingConfig:
        LogGroup: !Ref InitTableLogGroup
      # a full table snapshot is larger than an incremental sync
      EphemeralStorage:
        Size: 2048
      Architectures:
        - x86_64
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub '${EnvironmentParameter}/canvas_data_2*'
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseUserSecretCanvas
        - KMSDecryptPolicy:
            KeyId: !Ref KmsKey
      Environment:
        Variables:
          ENV: !Ref EnvironmentParameter
          POWERTOOLS_METRICS_NAMESPACE: canvas-data-2
          POWERTOOLS_SERVICE_NAME: init_table
          LOG_LEVEL: !Ref LogLevel
          DB_USER_SECRET_NAME: !Ref DatabaseUserSecretCanvas
      Timeout: 900
      MemorySize: 8192
      VpcConfig:
        SecurityGroupIds:
          - !Ref DatabaseClientSecurityGroup
        SubnetIds: !If
          - CreateNetwork
          - [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
          - !Ref LambdaSubnetListParameter

  WorkflowNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Sub "Canvas Data 2 Synchronization Workflow (${EnvironmentParameter})"

  StatesExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - !Sub states.${AWS::Region}.amazonaws.com
            Action: "sts:AssumeRole"
      Path: "/"
      Policies:
        - PolicyName: StatesExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "lambda:InvokeFunction"
                Resource:
                  - !Sub "${ListTablesFunction.Arn}*"
                  - !Sub "${SyncTableFunction.Arn}*"
                  - !Sub "${InitTableFunction.Arn}*"
        - PolicyName: NotificationPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref WorkflowNotificationTopic
        # Step Functions manages its log delivery through resource-level APIs that
        # do not accept a scoped-down resource ARN; AWS requires "*" here.
        - PolicyName: LoggingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"
        - PolicyName: TracingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"

  CD2RefreshStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Role: !GetAtt StatesExecutionRole.Arn
      Tracing:
        Enabled: true
      # Step Functions execution logging defaults to OFF, which leaves the console
      # as the only record of why a run failed.
      Logging:
        Level: ALL
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      Events:
        ThreeHourlySchedule:
          Type: ScheduleV2
          Properties:
            Description: Execute the Canvas Data 2 Step Function every 3 hours
            FlexibleTimeWindow:
              Mode: FLEXIBLE
              MaximumWindowInMinutes: 10
            ScheduleExpression: rate(3 hours)
            State: ENABLED
      Definition:
        StartAt: ListTables
        States:
          ListTables:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            OutputPath: "$.Payload"
            Parameters:
              Payload.$: "$"
              FunctionName: !Ref ListTablesFunction
            Retry:
              - ErrorEquals:
                 - Lambda.ServiceException
                 - Lambda.AWSLambdaException
                 - Lambda.SdkClientException
                 - Lambda.TooManyRequestsException
                IntervalSeconds: 2
                MaxAttempts: 6
                BackoffRate: 6
            Next: ProcessTables
          ProcessTables:
            Type: Map
            # Must be a literal integer. CloudFormation resolves intrinsics inside
            # an inline state machine definition to strings, and ASL requires an
            # integer here, so !Ref to a Number parameter fails deployment with
            # "SCHEMA_VALIDATION_FAILED: Expected value of type Integer at
            # /States/ProcessTables/MaxConcurrency". To make this configurable
            # without editing the template, use MaxConcurrencyPath and supply the
            # value in the state input instead.
            #
            # Each concurrent iteration opens its own database connection, and
            # Aurora Serverless v2 scales max_connections with ACU capacity, so
            # raising this may also require raising DatabaseMinCapacityParameter.
            # The first run is the heaviest: every table needs initializing at once.
            MaxConcurrency: 10
            ItemsPath: "$.tables"
            Next: PivotResults
            ItemProcessor:
              ProcessorConfig:
                Mode: INLINE
              StartAt: SyncTable
              States:
                SyncTable:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    Payload.$: "$"
                    FunctionName: !Ref SyncTableFunction
                  Retry:
                    - ErrorEquals:
                      - Lambda.ServiceException
                      - Lambda.AWSLambdaException
                      - Lambda.SdkClientException
                      - Lambda.TooManyRequestsException
                      IntervalSeconds: 2
                      MaxAttempts: 6
                      BackoffRate: 6
                  Catch:
                    - ErrorEquals:
                      - States.TaskFailed
                      ResultPath: "$.error"
                      Next: TableFailed
                  Next: CheckSyncState
                CheckSyncState:
                  Type: Choice
                  Choices:
                    - Variable: "$.Payload.state"
                      StringEquals: needs_init
                      Next: InitTable
                    # no views are created against these tables, so this should not
                    # happen; surface it as a failure rather than silently passing
                    - Variable: "$.Payload.state"
                      StringEquals: needs_ddl_update
                      Next: TableFailed
                  Default: TableComplete
                InitTable:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    Payload.$: "$.Payload"
                    FunctionName: !Ref InitTableFunction
                  Retry:
                    - ErrorEquals:
                      - Lambda.ServiceException
                      - Lambda.AWSLambdaException
                      - Lambda.SdkClientException
                      - Lambda.TooManyRequestsException
                      IntervalSeconds: 2
                      MaxAttempts: 6
                      BackoffRate: 6
                  Catch:
                    - ErrorEquals:
                      - States.TaskFailed
                      ResultPath: "$.error"
                      Next: TableFailed
                  Next: CheckInitState
                CheckInitState:
                  Type: Choice
                  Choices:
                    - Variable: "$.Payload.state"
                      StringEquals: failed
                      Next: TableFailed
                  Default: TableComplete
                TableFailed:
                  Type: Pass
                  OutputPath: "$.Payload"
                  End: true
                TableComplete:
                  Type: Succeed
                  OutputPath: "$.Payload"
          PivotResults:
            Type: Pass
            Next: SendNotification
            Parameters:
              - failed.$: "$[?(@.state==failed || @.state==needs_init || @.state==needs_sync || @.state==needs_ddl_update)].table_name"
              - failed_init.$: "$[?(@.state==needs_init)].table_name"
              - failed_sync.$: "$[?(@.state==needs_sync)].table_name"
              - failed_ddl_update.$: "$[?(@.state==needs_ddl_update)].table_name"
              - complete.$: "$[?(@.state==complete)].table_name"
              - num_failed.$: "States.ArrayLength($[?(@.state==failed || @.state==needs_init || @.state==needs_sync || @.state==needs_ddl_update)].table_name)"
              - num_complete.$: "States.ArrayLength($[?(@.state==complete)].table_name)"
          SendNotification:
            Type: Task
            Resource: arn:aws:states:::sns:publish
            Parameters:
              Message.$: "$"
              TopicArn: !Ref WorkflowNotificationTopic
            End: true

  # The workflow publishes a summary to SNS on every run, success or failure, so
  # failures are easy to miss among the routine notifications. This alarms only
  # when an execution actually fails.
  WorkflowFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cd2-${EnvironmentParameter}-workflow-failed
      AlarmDescription: The Canvas Data 2 refresh workflow failed to complete.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref CD2RefreshStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WorkflowNotificationTopic

Outputs:
  VpcId:
    Condition: CreateNetwork
    Value: !Ref Vpc
    Description: The ID of the VPC created by this stack
  PrivateSubnetIds:
    Condition: CreateNetwork
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
    Description: The private subnets holding the database and the Lambda functions
  PublicSubnetIds:
    Condition: CreateNetwork
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2]]
    Description: The public subnets holding the NAT gateway
  AdminSecretArn:
    Value: !GetAtt AuroraDatabaseCluster.MasterUserSecret.SecretArn
    Description: The ARN of the Aurora admin user secret
    Export:
      Name: !Sub cd2-aurora-admin-secret-arn-${EnvironmentParameter}
  AuroraClusterArn:
    Value: !GetAtt AuroraDatabaseCluster.DBClusterArn
    Description: The ARN of the Aurora cluster
    Export:
      Name: !Sub cd2-aurora-cluster-arn-${EnvironmentParameter}
