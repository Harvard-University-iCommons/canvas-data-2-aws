version = 0.1

# The Lambda functions depend on packages with compiled extensions (asyncpg, tsv2py,
# aiohttp). Building outside a container resolves wheels for the build host, which
# produces a broken package whenever the host platform differs from the Lambda
# runtime. Always build in the Lambda-matching container image.
[default.build.parameters]
use_container = true

[dev]
[dev.build]
[dev.build.parameters]
use_container = true

[dev.deploy]
[dev.deploy.parameters]
stack_name = "canvas-data-2-dev"
s3_prefix = "canvas-data-2-dev"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
parameter_overrides = "EnvironmentParameter=\"dev\" LogLevel=\"DEBUG\" SkipTablesParameter=\"\""
image_repositories = []
tags = "environment=\"dev\""
resolve_s3 = true

[prod]
[prod.build]
[prod.build.parameters]
use_container = true

[prod.deploy]
[prod.deploy.parameters]
stack_name = "canvas-data-2-prod"
s3_prefix = "canvas-data-2-prod"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
parameter_overrides = "EnvironmentParameter=\"prod\" LogLevel=\"INFO\" SkipTablesParameter=\"\""
image_repositories = []
tags = "environment=\"prod\""
resolve_s3 = true