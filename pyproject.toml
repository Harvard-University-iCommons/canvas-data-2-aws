[project]
name = "canvas-data-2-aws"
version = "0.1.0"
description = "Tooling for the Canvas Data 2 replica database stack"
readme = "README.md"
requires-python = ">=3.11"

# These are the dependencies of prepare_aurora_db.py only.
#
# The Lambda functions declare their own dependencies in <function>/requirements.txt,
# which is what `sam build` installs into each deployment package. Adding them here
# would duplicate those pins and let the two drift apart.
dependencies = [
    "boto3>=1.34",
    "rich>=13",
]
